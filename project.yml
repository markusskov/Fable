name: Fable
options:
  bundleIdPrefix: com.markusskov
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: N2M33U7L7U
targets:
  Fable:
    type: application
    platform: iOS
    sources:
      - App/Sources
      - App/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.markusskov.fable
        # Lets `xcodebuild -exportLocalizations` see LocalizedStringKey /
        # String(localized:) literals in Swift — the check that keeps
        # Localizable.xcstrings complete lives on this flag.
        SWIFT_EMIT_LOC_STRINGS: YES
        # iPhone + iPad since the v1.1 reading-column layout (Milestone 5).
        # NOTE for the next ASC submission: iPad support makes 13" iPad
        # screenshots a required listing asset (see OWNER-ASKS).
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: 6
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        # iPad supports every orientation (a bedtime tablet lives on its
        # side); the reading-column layout is orientation-agnostic.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_CFBundleDisplayName: Fable
        # Only Apple's OS-provided TLS/StoreKit crypto — exempt, so App Store
        # Connect never pauses builds on the export-compliance question.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  # Drives the real app through a staged evening and exports the App Store
  # screenshot set. Own scheme below — never part of CI's `Fable` scheme.
  # Run via scripts/capture-screenshots.sh.
  FableScreenshots:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - App/UITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Fable
    dependencies:
      - target: Fable
  FableTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - App/Tests
      # Bundled so the tests can validate it; the app itself never reads it
      # (Xcode's Run action applies it, and the real store is the App Store).
      - path: App/StoreKit/Fable.storekit
        buildPhase: resources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Fable
schemes:
  Fable:
    build:
      targets:
        Fable: all
        FableTests: [test]
    run:
      config: Debug
      storeKitConfiguration: App/StoreKit/Fable.storekit
    test:
      config: Debug
      targets:
        - FableTests
  FableScreenshots:
    build:
      targets:
        Fable: all
        FableScreenshots: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FableScreenshots
